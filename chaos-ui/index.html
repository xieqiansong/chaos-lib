<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Chaos</title>
    <script>
      // 尽早应用持久化主题，避免首屏闪烁（默认 dark）
      try {
        var t = localStorage.getItem('chaos-ui:theme')
        document.documentElement.classList.add(t === 'paper' ? 'paper' : 'dark')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
</head>
<body>
<div id="app"></div>
    <script src="/assets/monaco/min/vs/loader.js"></script>
    <script>
      require.config({ paths: { vs: '/assets/monaco/min/vs' } })
    </script>
<script src="/src/main.ts" type="module"></script>
</body>
</html>
